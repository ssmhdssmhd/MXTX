# ============================================================
# 超级嗅探 super-sniffer - Nginx 反向代理配置
#
# 适用版本: v2.2.0+ (cs1 分支)
# 后端服务: node node.js (默认监听 127.0.0.1:1314)
#
# 【解决 "400 Bad Request - Request Header Or Cookie Too Large"】
#   nginx 默认 large_client_header_buffers 4 8k（总 32KB），
#   浏览器对同域累积较多 Cookie 时，Cookie 头大小超限即报 400。
#   本配置：
#     1) 加大请求头缓冲 -> 8 个 32k，单行 32k、总 256k，杜绝超限；
#     2) 剥离 Cookie（应用只认 Authorization Basic 头，不依赖 Cookie）；
#     3) SSE / 长连接适配（嗅探页靠 EventSource 流式推送进度）。
#
# 使用:
#   sudo cp deploy/nginx.conf /etc/nginx/conf.d/super-sniffer.conf
#   sudo nginx -t && sudo systemctl reload nginx
# ============================================================

# 请求头缓冲：单行最大 32k，最多 8 行，总缓冲 256k（解决 Header/Cookie Too Large）
large_client_header_buffers 8 32k;
client_header_buffer_size   32k;

# 允许上传体积（嗅探 url 参数较长时留足余量）
client_max_body_size        10m;

# 长连接超时
keepalive_timeout           65;
# SSE 长连接读取超时（嗅探可能持续数分钟，必须足够大）
proxy_read_timeout          600s;
proxy_send_timeout          600s;

server {
    listen       80;
    server_name  _;

    # 所有路径反向代理到后端 Node 服务
    location / {
        proxy_pass         http://127.0.0.1:1314;
        proxy_http_version 1.1;

        # 剥离 Cookie：应用只用 Authorization Basic 认证，不依赖 Cookie。
        # 这一步直接从源头消除“Cookie 过大”导致 400 的根因。
        proxy_set_header Cookie "";

        # 保留 Basic Auth 认证头（默认也会透传，这里显式声明更稳妥）
        proxy_set_header Authorization $http_authorization;

        # 透传真实客户端信息
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 关键：关闭缓冲，让进度事件实时推送到浏览器
        proxy_buffering     off;
        proxy_cache         off;
        proxy_set_header    Connection "";

        # 后端异常时快速失败重试
        proxy_next_upstream     error timeout http_502 http_503;
        proxy_connect_timeout   10s;
    }
}
