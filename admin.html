<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>超级嗅探 - 管理后台</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --card-hover: #263449;
    --border: #334155;
    --text: #e2e8f0;
    --text-dim: #94a3b8;
    --primary: #3b82f6;
    --primary-hover: #2563eb;
    --success: #22c55e;
    --warning: #f59e0b;
    --danger: #ef4444;
    --radius: 12px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px;
  }
  .container { max-width: 960px; margin: 0 auto; }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    flex-wrap: wrap;
    gap: 12px;
  }
  .header h1 {
    font-size: 22px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .logo {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  .badge {
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text-dim);
  }
  .badge.online { color: var(--success); border-color: rgba(34,197,94,.4); }
  .badge.offline { color: var(--danger); border-color: rgba(239,68,68,.4); }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    transition: background .2s;
  }
  .card:hover { background: var(--card-hover); }
  .card-title {
    font-size: 14px;
    color: var(--text-dim);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .card-title .icon { font-size: 16px; }
  .version-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .version-label { font-size: 13px; color: var(--text-dim); }
  .version-value { font-size: 18px; font-weight: 700; }
  .version-value.new { color: var(--success); }
  .version-value.old { color: var(--warning); }
  .version-value.current { color: var(--text); }
  .desc { font-size: 12px; color: var(--text-dim); margin-top: 4px; }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 10px 18px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all .2s;
    color: #fff;
  }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-primary { background: var(--primary); }
  .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
  .btn-success { background: var(--success); }
  .btn-success:hover:not(:disabled) { background: #16a34a; }
  .btn-outline {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
  }
  .btn-outline:hover:not(:disabled) { background: var(--card-hover); }
  .btn-block { width: 100%; margin-top: 14px; }
  .btn-lg { padding: 14px 20px; font-size: 15px; }

  .status-bar {
    display: flex;
    gap: 16px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .status-item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 20px;
    flex: 1;
    min-width: 150px;
  }
  .status-item .label { font-size: 12px; color: var(--text-dim); margin-bottom: 4px; }
  .status-item .value { font-size: 15px; font-weight: 600; }

  .source-card { margin-bottom: 16px; }
  .source-desc { font-size: 13px; color: var(--text-dim); margin-bottom: 12px; }
  .source-btns { display: flex; gap: 12px; flex-wrap: wrap; }
  .source-btn {
    flex: 1;
    min-width: 200px;
    flex-direction: column;
    gap: 4px;
    padding: 14px 18px;
    font-size: 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--card);
    color: var(--text);
    cursor: pointer;
    transition: all .2s;
  }
  .source-btn:hover { background: var(--card-hover); border-color: var(--primary); }
  .source-btn.active {
    background: rgba(59,130,246,.15);
    border-color: var(--primary);
    color: var(--primary);
  }
  .source-btn.active .source-branch { color: var(--primary); }
  .source-btn .source-branch {
    font-size: 11px;
    color: var(--text-dim);
    font-weight: 400;
  }

  .log-box {
    margin-top: 16px;
    background: #0b1220;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    max-height: 280px;
    overflow-y: auto;
    font-family: "SF Mono", Consolas, monospace;
    font-size: 12px;
    line-height: 1.8;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .log-box .log-time { color: var(--text-dim); }
  .log-box .log-ok { color: var(--success); }
  .log-box .log-err { color: var(--danger); }
  .log-box .log-info { color: var(--text); }
  .log-box .log-warn { color: var(--warning); }

  .updating { pointer-events: none; opacity: .6; }
  .spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 下载进度条 */
  .progress-wrap {
    margin-top: 14px;
    display: none;
  }
  .progress-wrap.active { display: block; }
  .progress-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 6px;
  }
  .progress-track {
    height: 10px;
    background: rgba(255,255,255,.08);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #6366f1, #a855f7);
    border-radius: 6px;
    transition: width .2s ease;
  }
  .progress-pct { color: var(--text); font-weight: 600; }
  .progress-phase { color: var(--text-dim); }

  .footer {
    text-align: center;
    color: var(--text-dim);
    font-size: 12px;
    margin-top: 24px;
  }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1><span class="logo">🔍</span> 超级嗅探 管理后台</h1>
    <div style="display:flex; gap:10px; align-items:center;">
      <a class="btn-primary" href="/admin/sniff" style="padding:7px 13px; border-radius:6px; background:linear-gradient(135deg,#a855f7,#6366f1); color:#fff; text-decoration:none; font-size:13px; font-weight:600;">🔎 万能嗅探</a>
      <span class="badge" id="serviceBadge">检测中...</span>
      <span class="badge" id="versionBadge">v-</span>
    </div>
  </div>

  <!-- 服务状态 -->
  <div class="status-bar">
    <div class="status-item">
      <div class="label">服务状态</div>
      <div class="value" id="stService">-</div>
    </div>
    <div class="status-item">
      <div class="label">监听端口</div>
      <div class="value" id="stPort">-</div>
    </div>
    <div class="status-item">
      <div class="label">Chrome 版本</div>
      <div class="value" id="stChrome">-</div>
    </div>
    <div class="status-item">
      <div class="label">当前版本</div>
      <div class="value" id="stVersion">-</div>
    </div>
  </div>

  <!-- 更新源切换 -->
  <div class="card source-card">
    <div class="card-title">
      <span><span class="icon">🔀</span> 更新源</span>
      <span class="badge" id="sourceBadge">-</span>
    </div>
    <div class="source-desc" id="sourceDesc">选择更新源后，将获取对应分支的最新版本。</div>
    <div class="source-btns">
      <button class="btn btn-outline source-btn" id="btnStable" onclick="switchSource('stable')">
        🛡️ 稳定版 <span class="source-branch">main 分支</span>
      </button>
      <button class="btn btn-outline source-btn" id="btnBeta" onclick="switchSource('beta')">
        🧪 先行版 <span class="source-branch">cs1 分支</span>
      </button>
    </div>
  </div>

  <!-- 更新区域 -->
  <div class="grid">
    <!-- 浏览器更新 -->
    <div class="card" id="browserCard">
      <div class="card-title">
        <span><span class="icon">🌐</span> 浏览器更新</span>
        <span class="badge" id="browserUpdateBadge">-</span>
      </div>
      <div class="version-row">
        <span class="version-label">当前版本</span>
        <span class="version-value current" id="browserCurrent">-</span>
      </div>
      <div class="version-row">
        <span class="version-label">最新版本</span>
        <span class="version-value" id="browserLatest">-</span>
      </div>
      <div class="desc">仅更新 Chrome 浏览器，不影响源码与服务逻辑。</div>
      <button class="btn btn-primary btn-block" id="btnBrowser" onclick="doUpdate('browser')">更新浏览器</button>
    </div>

    <!-- 源码更新 -->
    <div class="card" id="sourceCard">
      <div class="card-title">
        <span><span class="icon">📦</span> 源码更新</span>
        <span class="badge" id="sourceUpdateBadge">-</span>
      </div>
      <div class="version-row">
        <span class="version-label">当前版本</span>
        <span class="version-value current" id="sourceCurrent">-</span>
      </div>
      <div class="version-row">
        <span class="version-label">最新版本</span>
        <span class="version-value" id="sourceLatest">-</span>
      </div>
      <div class="desc">仅更新项目源码（node.js、api.php 等），不影响浏览器。</div>
      <button class="btn btn-primary btn-block" id="btnSource" onclick="doUpdate('source')">更新源码</button>
    </div>
  </div>

  <!-- 一键升级 -->
  <button class="btn btn-success btn-block btn-lg" id="btnAll" onclick="doUpdate('all')">
    ⚡ 一键升级（浏览器 + 源码）
  </button>

  <!-- 下载进度条 -->
  <div class="progress-wrap" id="progressWrap">
    <div class="progress-head">
      <span class="progress-phase" id="progressPhase">正在下载...</span>
      <span class="progress-pct" id="progressPct">0%</span>
    </div>
    <div class="progress-track">
      <div class="progress-bar" id="progressBar"></div>
    </div>
  </div>

  <!-- 日志 -->
  <div class="log-box" id="logBox"><span class="log-time">[系统]</span> 等待操作...</div>

  <div class="footer">超级嗅探 v2.4.7 · 在线更新系统（稳定版 / 先行版）</div>
</div>

<script>
// ========== 通用工具 ==========
// 把相对 URL 转成绝对路径（location.origin 不含 user:pass，避免浏览器
// "Request cannot be constructed from a URL that includes credentials" 错误）
function abs(path) {
  return location.origin + path;
}

// ========== 状态管理 ==========
let updating = false;
let latestRelease = null;

function log(msg, level) {
  const box = document.getElementById('logBox');
  const time = new Date().toLocaleTimeString('zh-CN', { hour12: false });
  const cls = level === 'ok' ? 'log-ok' : level === 'err' ? 'log-err' : level === 'warn' ? 'log-warn' : 'log-info';
  const line = document.createElement('div');
  line.innerHTML = `<span class="log-time">[${time}]</span> <span class="${cls}">${msg}</span>`;
  box.appendChild(line);
  box.scrollTop = box.scrollHeight;
}

function setBadge(el, text, cls) {
  el.textContent = text;
  el.className = 'badge' + (cls ? ' ' + cls : '');
}

function setButtons(disabled) {
  updating = disabled;
  ['btnBrowser', 'btnSource', 'btnAll'].forEach((id) => {
    document.getElementById(id).disabled = disabled;
  });
  if (disabled) {
    document.getElementById('browserCard').classList.add('updating');
    document.getElementById('sourceCard').classList.add('updating');
  } else {
    document.getElementById('browserCard').classList.remove('updating');
    document.getElementById('sourceCard').classList.remove('updating');
  }
}

// ========== 更新源 ==========
function renderSource(source) {
  const isBeta = source === 'beta';
  document.getElementById('btnStable').classList.toggle('active', !isBeta);
  document.getElementById('btnBeta').classList.toggle('active', isBeta);
  const badge = document.getElementById('sourceBadge');
  badge.textContent = isBeta ? '先行版 · cs1 分支' : '稳定版 · main 分支';
  badge.className = 'badge' + (isBeta ? ' online' : '');
  document.getElementById('sourceDesc').textContent =
    isBeta
      ? '当前为先行版更新源，将从 cs1 分支获取最新版本（新功能体验）。'
      : '当前为稳定版更新源，将从 main 分支获取最新版本（稳定发布）。';
}

async function switchSource(source) {
  if (updating) return;
  try {
    const res = await fetch(abs('/admin/api/update-source'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ source })
    });
    const data = await res.json();
    if (data.code !== 200) {
      log('切换更新源失败: ' + (data.msg || '未知错误'), 'err');
      return;
    }
    renderSource(data.source);
    log(`已切换到${data.label}（${data.branch} 分支）`, 'ok');
    // 切换后重新检查更新
    checkUpdate();
  } catch (e) {
    log('切换更新源失败: ' + e.message, 'err');
  }
}

// ========== 加载状态 ==========
async function loadStatus() {
  try {
    const res = await fetch(abs('/admin/api/status'));
    const data = await res.json();
    document.getElementById('stService').textContent = data.service;
    document.getElementById('stPort').textContent = data.port;
    document.getElementById('stChrome').textContent = data.chromeVersion;
    document.getElementById('stVersion').textContent = 'v' + data.version;
    document.getElementById('versionBadge').textContent = 'v' + data.version;
    setBadge(document.getElementById('serviceBadge'), data.service === '运行中' ? '运行中' : '异常', data.service === '运行中' ? 'online' : 'offline');
    document.getElementById('browserCurrent').textContent = data.chromeVersion;
    document.getElementById('sourceCurrent').textContent = 'v' + data.version;
    if (data.source) renderSource(data.source);
  } catch (e) {
    setBadge(document.getElementById('serviceBadge'), '离线', 'offline');
    log('无法连接后台服务: ' + e.message, 'err');
  }
}

// ========== 检查更新 ==========
async function checkUpdate() {
  try {
    const res = await fetch(abs('/admin/api/check-update'));
    const data = await res.json();
    if (data.code !== 200) {
      log('检查更新失败: ' + (data.msg || '未知错误'), 'warn');
      return;
    }
    latestRelease = data;
    // 用规范化后的基础版本号展示（去掉 -cs1 后缀），分支名单独显示，避免版本不一致
    const latestVer = data.latestVersionBase || String(data.latestVersion || '').split('-')[0];
    const branchLabel = data.branch ? `（${data.branch} 分支）` : '';

    // 源码
    document.getElementById('sourceLatest').textContent = 'v' + latestVer + branchLabel;
    const srcNeed = data.sourceNeedUpdate;
    setBadge(
      document.getElementById('sourceUpdateBadge'),
      srcNeed ? '有新版本' : '已是最新',
      srcNeed ? 'online' : ''
    );
    document.getElementById('sourceLatest').className = 'version-value ' + (srcNeed ? 'new' : 'current');

    // 浏览器
    const chromeNow = document.getElementById('stChrome').textContent;
    document.getElementById('browserLatest').textContent = data.browserAsset ? data.browserAsset.name : '无浏览器包';
    const brNeed = data.browserNeedUpdate;
    setBadge(
      document.getElementById('browserUpdateBadge'),
      brNeed ? '可更新' : '已是最新',
      brNeed ? 'online' : ''
    );
    document.getElementById('browserLatest').className = 'version-value ' + (brNeed ? 'new' : 'current');

    log(`检查完成：${data.sourceLabel || ''}最新版本 v${latestVer}${branchLabel}，源码${srcNeed ? '有更新' : '已最新'}，浏览器${brNeed ? '有更新' : '已最新'}`, 'ok');
  } catch (e) {
    log('检查更新失败: ' + e.message, 'err');
  }
}

// ========== 执行更新 ==========
function setProgress(p) {
  const wrap = document.getElementById('progressWrap');
  const bar = document.getElementById('progressBar');
  const pctEl = document.getElementById('progressPct');
  const phaseEl = document.getElementById('progressPhase');
  wrap.classList.add('active');
  const pct = Math.max(0, Math.min(100, Math.round(p.pct || 0)));
  bar.style.width = pct + '%';
  pctEl.textContent = pct + '%';
  const phase = p.phase === 'browser' ? '浏览器包' : p.phase === 'source' ? '源码包' : '下载';
  if (p.total > 0) {
    const mb = (b) => (b >= 1024 * 1024 ? (b / 1024 / 1024).toFixed(1) + ' MB' : (b / 1024).toFixed(1) + ' KB');
    phaseEl.textContent = `正在下载${phase} ${mb(p.received || 0)} / ${mb(p.total)}`;
  } else {
    phaseEl.textContent = `正在下载${phase}...`;
  }
}
function resetProgress() {
  const wrap = document.getElementById('progressWrap');
  wrap.classList.remove('active');
  document.getElementById('progressBar').style.width = '0%';
  document.getElementById('progressPct').textContent = '0%';
}

async function doUpdate(type) {
  if (updating) return;
  setButtons(true);
  resetProgress();
  log('========== 开始更新 ==========', 'info');

  try {
    const res = await fetch(abs('/admin/api/update'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ type })
    });

    // 流式读取日志
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();
      lines.forEach((line) => {
        if (!line.trim()) return;
        try {
          const item = JSON.parse(line);
          if (item.type === 'log') log(item.msg, item.level || 'info');
          else if (item.type === 'progress') setProgress(item);
          else if (item.type === 'done') {
            log(item.msg, item.ok ? 'ok' : 'err');
            if (item.ok) setProgress({ pct: 100, phase: '', received: 0, total: 0 });
            setTimeout(resetProgress, 3000);
            if (item.restart) {
              log('服务即将重启，页面将自动刷新...', 'warn');
              setTimeout(() => location.reload(), 2500);
            }
          }
        } catch (e) { /* 忽略非 JSON 行 */ }
      });
    }
  } catch (e) {
    log('更新请求失败: ' + e.message, 'err');
  } finally {
    setButtons(false);
    // 刷新状态
    setTimeout(() => { loadStatus(); checkUpdate(); }, 1500);
  }
}

// ========== 初始化 ==========
loadStatus();
checkUpdate();
setInterval(() => { if (!updating) loadStatus(); }, 30000);
</script>
</body>
</html>
